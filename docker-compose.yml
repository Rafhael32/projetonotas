name: node-notas
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes_local
      POSTGRES_DB: notes
    ports:
      - "127.0.0.1:6000:5432"
    volumes:
      - notes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  notes_data: